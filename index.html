<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>Hyra Account</title>
        <meta name="theme-color" content="#3f6b4e" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-title" content="Hyra" />
        <link rel="manifest" href="manifest.webmanifest" />
        <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
        <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
        <style>
            :root {
                --bg: #f6f3ee;
                --surface: #ffffff;
                --surface2: #fbf9f5;
                --ink: #15130f;
                --ink2: #3a3630;
                --ink3: #7c766c;
                --ink4: #b5aea3;
                --line: rgba(20, 18, 15, 0.08);
                --accent: #3f6b4e;
                --accent-tint: #e6eee7;
                --danger: #9a3f3f;
                --sans: "Manrope", -apple-system, system-ui, sans-serif;
                --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                margin: 0;
                padding: 0;
                background: var(--bg);
                color: var(--ink);
            }

            body {
                font-family: var(--sans);
                -webkit-font-smoothing: antialiased;
                min-height: 100vh;
                overflow-x: hidden;
            }

            .app {
                max-width: 480px;
                margin: 0 auto;
                padding: calc(env(safe-area-inset-top, 0px) + 20px) 18px calc(env(safe-area-inset-bottom, 0px) + 30px);
                display: flex;
                flex-direction: column;
                gap: 14px;
            }

            .eyebrow {
                font-size: 11px;
                font-weight: 600;
                color: var(--ink3);
                letter-spacing: 1.3px;
                text-transform: uppercase;
            }

            .total-card {
                border-radius: 22px;
                padding: 22px 20px 20px;
                background: linear-gradient(155deg, var(--surface) 0%, var(--accent-tint) 100%);
                border: 1px solid var(--line);
            }

            .total-card .eyebrow {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 14px;
            }

            .dot {
                width: 6px;
                height: 6px;
                border-radius: 3px;
                background: var(--accent);
            }

            .total-row {
                display: flex;
                align-items: baseline;
                gap: 10px;
            }

            .total-value {
                font-family: var(--mono);
                font-size: 44px;
                font-weight: 600;
                letter-spacing: -1.2px;
                line-height: 1;
            }

            .total-unit {
                font-size: 15px;
                font-weight: 500;
                color: var(--ink3);
            }

            .total-sub {
                margin-top: 12px;
                font-size: 14px;
                color: var(--ink3);
                line-height: 1.4;
            }

            .bar {
                display: flex;
                gap: 3px;
                height: 10px;
                margin-top: 16px;
            }

            .bar:empty {
                display: none;
            }

            .bar i {
                display: block;
                min-width: 6px;
                border-radius: 5px;
                background: var(--c);
            }

            .panel {
                padding: 20px 18px 18px;
                background: var(--surface);
                border-radius: 22px;
                border: 1px solid var(--line);
            }

            .panel h2 {
                margin: 0 0 16px;
                font-size: 17px;
                font-weight: 700;
                letter-spacing: -0.4px;
            }

            label {
                display: block;
                margin-bottom: 8px;
                font-size: 11px;
                font-weight: 600;
                color: var(--ink3);
                text-transform: uppercase;
                letter-spacing: 1.1px;
            }

            .field {
                margin-bottom: 14px;
            }

            input {
                width: 100%;
                padding: 13px 14px;
                background: var(--surface2);
                border: 1px solid var(--line);
                border-radius: 12px;
                outline: none;
                font-family: var(--sans);
                font-size: 16px;
                color: var(--ink);
                letter-spacing: -0.2px;
            }

            input:focus {
                border-color: var(--accent);
            }

            .amount-wrap {
                position: relative;
            }

            #amount {
                font-family: var(--mono);
                font-size: 22px;
                font-weight: 600;
                letter-spacing: -0.5px;
                padding-right: 50px;
            }

            .amount-wrap span {
                position: absolute;
                right: 14px;
                top: 50%;
                transform: translateY(-50%);
                font-size: 13px;
                font-weight: 600;
                color: var(--ink3);
            }

            .add-btn {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                width: 100%;
                padding: 15px;
                border: 0;
                background: var(--ink);
                color: #fff;
                border-radius: 14px;
                font-family: var(--sans);
                font-size: 15px;
                font-weight: 600;
                letter-spacing: -0.2px;
                cursor: pointer;
                transition: background 0.15s ease;
            }

            .add-btn:disabled {
                background: var(--ink4);
                cursor: not-allowed;
            }

            .list-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin: 8px 4px 10px;
            }

            .list {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }

            .row {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 12px 14px;
                background: var(--t);
                border-radius: 14px;
                border: 1px solid var(--line);
                border-left: 5px solid var(--c);
            }

            .row-name {
                flex: 1;
                min-width: 0;
                font-size: 14px;
                font-weight: 600;
                letter-spacing: -0.2px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .row-name small {
                display: block;
                margin-top: 2px;
                font-size: 11.5px;
                font-weight: 400;
                color: var(--ink3);
            }

            .row-amount {
                font-family: var(--mono);
                font-size: 15px;
                font-weight: 600;
                letter-spacing: -0.3px;
            }

            .row-amount span {
                color: var(--ink3);
                font-size: 11px;
                font-weight: 500;
            }

            .del {
                border: 0;
                background: none;
                padding: 6px;
                border-radius: 8px;
                color: var(--ink4);
                display: inline-flex;
                cursor: pointer;
            }

            .del:hover {
                color: var(--danger);
            }

            .empty {
                padding: 30px 16px;
                text-align: center;
                border-radius: 18px;
                border: 1.5px dashed var(--line);
            }

            .empty strong {
                display: block;
                font-size: 14px;
                color: var(--ink2);
            }

            .empty span {
                display: block;
                margin-top: 4px;
                font-size: 12.5px;
                color: var(--ink3);
            }
        </style>
    </head>
    <body>
        <main class="app">
            <header>
                <div class="eyebrow">Hyra account</div>
            </header>

            <section class="total-card" aria-live="polite">
                <div class="eyebrow"><span class="dot"></span>Put into Hyra account</div>
                <div class="total-row">
                    <span class="total-value" id="total">0</span>
                    <span class="total-unit">kr</span>
                </div>
                <div class="total-sub" id="total-sub">No expenses yet.</div>
                <div class="bar" id="bar"></div>
            </section>

            <section class="panel">
                <h2>Add expense</h2>
                <div class="field">
                    <label for="name">What for</label>
                    <input id="name" placeholder="e.g. hyra, el, internet" autocomplete="off" />
                </div>
                <div class="field">
                    <label for="amount">Amount (kr)</label>
                    <div class="amount-wrap">
                        <input id="amount" placeholder="0" inputmode="decimal" autocomplete="off" />
                        <span>kr</span>
                    </div>
                </div>
                <button class="add-btn" id="add" disabled>
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="#fff" stroke-width="2" stroke-linecap="round" /></svg>
                    Add to Hyra account
                </button>
            </section>

            <section>
                <div class="list-head">
                    <div class="eyebrow" id="count">Expenses · 0</div>
                </div>
                <div class="list" id="list"></div>
            </section>
        </main>

        <script>
            (function () {
                var STORAGE_KEY = "hyra.v1";
                var PALETTE = [
                    { c: "#3f6b4e", t: "#e6eee7" },
                    { c: "#3a5878", t: "#e4eaf1" },
                    { c: "#b0573a", t: "#f8e7e1" },
                    { c: "#7a4a6b", t: "#f1e6ee" },
                    { c: "#8a6a2e", t: "#f2eadc" },
                    { c: "#2f7f86", t: "#e0f0f1" }
                ];
                function color(e) {
                    return PALETTE[(Number(e.c) || 0) % PALETTE.length];
                }
                var expenses = load();

                var $ = function (id) { return document.getElementById(id); };
                var nameEl = $("name");
                var amountEl = $("amount");
                var addBtn = $("add");

                function load() {
                    try {
                        var data = JSON.parse(localStorage.getItem(STORAGE_KEY));
                        return Array.isArray(data) ? data : [];
                    } catch (e) {
                        return [];
                    }
                }

                function save() {
                    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses)); } catch (e) {}
                }

                function fmt(n) {
                    return Math.round(n).toLocaleString("sv-SE");
                }

                function total() {
                    return expenses.reduce(function (sum, e) { return sum + (Number(e.amount) || 0); }, 0);
                }

                function render() {
                    $("total").textContent = fmt(total());
                    $("total-sub").textContent = expenses.length
                        ? expenses.length + (expenses.length === 1 ? " expense" : " expenses") + " added up."
                        : "No expenses yet.";
                    $("count").textContent = "Expenses · " + expenses.length;

                    var bar = $("bar");
                    bar.textContent = "";
                    expenses.forEach(function (e) {
                        var seg = document.createElement("i");
                        seg.style.flex = String(Math.max(Number(e.amount) || 0, 0.0001));
                        seg.style.setProperty("--c", color(e).c);
                        seg.title = (e.name || "—") + " · " + fmt(e.amount) + " kr";
                        bar.appendChild(seg);
                    });

                    var list = $("list");
                    list.textContent = "";

                    if (!expenses.length) {
                        var empty = document.createElement("div");
                        empty.className = "empty";
                        empty.innerHTML = "<strong>No expenses yet</strong><span>Add what goes through the Hyra account and the total shows up above.</span>";
                        list.appendChild(empty);
                        return;
                    }

                    expenses.slice().sort(function (a, b) { return b.t - a.t; }).forEach(function (e) {
                        var row = document.createElement("div");
                        row.className = "row";
                        row.style.setProperty("--c", color(e).c);
                        row.style.setProperty("--t", color(e).t);

                        var name = document.createElement("div");
                        name.className = "row-name";
                        name.textContent = e.name || "—";
                        var when = document.createElement("small");
                        when.textContent = e.when;
                        name.appendChild(when);

                        var amt = document.createElement("div");
                        amt.className = "row-amount";
                        amt.textContent = fmt(e.amount) + " ";
                        var kr = document.createElement("span");
                        kr.textContent = "kr";
                        amt.appendChild(kr);

                        var del = document.createElement("button");
                        del.className = "del";
                        del.setAttribute("aria-label", "Delete");
                        del.innerHTML = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 4h10M6.5 4V2.5h3V4M5 4l.5 9a1 1 0 001 1h3a1 1 0 001-1L11 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
                        del.addEventListener("click", function () {
                            expenses = expenses.filter(function (x) { return x.id !== e.id; });
                            save();
                            render();
                        });

                        row.appendChild(name);
                        row.appendChild(amt);
                        row.appendChild(del);
                        list.appendChild(row);
                    });
                }

                function parsedAmount() {
                    return parseFloat(amountEl.value);
                }

                function updateButton() {
                    addBtn.disabled = !(parsedAmount() > 0);
                }

                function submit() {
                    var a = parsedAmount();
                    if (!(a > 0)) return;
                    expenses.push({
                        id: Math.random().toString(36).slice(2, 10),
                        name: nameEl.value.trim() || "Expense",
                        amount: a,
                        when: new Date().toLocaleDateString("sv-SE", { month: "short", day: "numeric" }),
                        c: expenses.length ? (Number(expenses[expenses.length - 1].c) || 0) + 1 : 0,
                        t: Date.now()
                    });
                    save();
                    nameEl.value = "";
                    amountEl.value = "";
                    updateButton();
                    render();
                    nameEl.focus();
                }

                amountEl.addEventListener("input", function () {
                    amountEl.value = amountEl.value.replace(/[^0-9.,]/g, "").replace(",", ".");
                    updateButton();
                });
                [nameEl, amountEl].forEach(function (el) {
                    el.addEventListener("keydown", function (ev) { if (ev.key === "Enter") submit(); });
                });
                addBtn.addEventListener("click", submit);

                render();
            })();
        </script>
    </body>
</html>

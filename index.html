<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>Split Expenses — Py & Lukas</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="expenses.css" />
    </head>
    <body>
        <div id="root"></div>

        <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
        <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
        <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

        <script type="text/babel">
            /* expenses.js */
            const { useState, useEffect, useMemo, useRef } = React;

            const TOK = {
                bg: "#F6F3EE",
                surface: "#FFFFFF",
                surface2: "#FBF9F5",
                ink: "#15130F",
                ink2: "#3A3630",
                ink3: "#7C766C",
                ink4: "#B5AEA3",
                line: "rgba(20,18,15,0.08)",
                line2: "rgba(20,18,15,0.04)",
                py: "#3F6B4E",
                pyTint: "#E6EEE7",
                lukas: "#3A5878",
                lukasTint: "#E4EAF1",
                share: "#8A6A2E",
                shareTint: "#F2EADC",
                danger: "#9A3F3F",
                sans: "'Manrope', -apple-system, system-ui, sans-serif",
                mono: "'JetBrains Mono', ui-monospace, SFMono-Regular, monospace",
            };

            const PEOPLE = {
                Py: { name: "Py", color: TOK.py, tint: TOK.pyTint, initial: "P" },
                Lukas: { name: "Lukas", color: TOK.lukas, tint: TOK.lukasTint, initial: "L" },
            };

            const STORAGE_KEY = "splitexpenses.v2";

            const loadExpenses = () => {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return [];
                    const data = JSON.parse(raw);
                    return Array.isArray(data) ? data : [];
                } catch {
                    return [];
                }
            };

            const saveExpenses = (list) => {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
                } catch {}
            };

            const fmt = (n) => {
                if (!Number.isFinite(n)) return "0";
                return Math.round(n).toLocaleString("sv-SE");
            };

            function computeTotals(expenses) {
                let pySplit = 0, lukasSplit = 0;
                let pyPersonal = 0, lukasPersonal = 0;
                for (const e of expenses) {
                    const amt = Number(e.amount) || 0;
                    if (e.type === "split") {
                        if (e.person === "Py") pySplit += amt;
                        else lukasSplit += amt;
                    } else {
                        if (e.person === "Py") pyPersonal += amt;
                        else lukasPersonal += amt;
                    }
                }
                const sharedTotal = pySplit + lukasSplit;
                const eachShare = sharedTotal / 2;
                const pyNet = pySplit - eachShare;
                const lukasNet = lukasSplit - eachShare;
                const pyOwesHyra = Math.max(0, eachShare - pySplit);
                const lukasOwesHyra = Math.max(0, eachShare - lukasSplit);
                let settlement = null;
                if (Math.abs(pyNet) > 0.5) {
                    if (pyNet > 0)
                        settlement = { from: "Lukas", to: "Py", amount: Math.abs(pyNet) };
                    else
                        settlement = { from: "Py", to: "Lukas", amount: Math.abs(pyNet) };
                }
                return {
                    pySplit, lukasSplit, pyPersonal, lukasPersonal,
                    pyTotal: pySplit + pyPersonal,
                    lukasTotal: lukasSplit + lukasPersonal,
                    sharedTotal, eachShare,
                    pyNet, lukasNet, pyOwesHyra, lukasOwesHyra,
                    settlement,
                };
            }

            function PersonDot({ who, size = 22 }) {
                const p = PEOPLE[who];
                return (
                    <span style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", width: size, height: size, borderRadius: size / 2, background: p.color, color: "#fff", fontFamily: TOK.sans, fontWeight: 700, fontSize: size * 0.5 }}>
                        {p.initial}
                    </span>
                );
            }

            function Segmented({ value, onChange, options, accent }) {
                return (
                    <div style={{ display: "grid", gridTemplateColumns: `repeat(${options.length}, 1fr)`, background: TOK.surface2, borderRadius: 12, padding: 4, gap: 2, border: `1px solid ${TOK.line}` }}>
                        {options.map((opt) => {
                            const active = value === opt.value;
                            return (
                                <button key={opt.value} onClick={() => onChange(opt.value)} style={{ all: "unset", cursor: "pointer", textAlign: "center", padding: "10px 8px", borderRadius: 9, background: active ? accent || TOK.ink : "transparent", color: active ? "#fff" : TOK.ink2, fontFamily: TOK.sans, fontWeight: active ? 600 : 500, fontSize: 14, letterSpacing: -0.1, transition: "background 0.15s ease, color 0.15s ease", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
                                    {opt.icon && <span style={{ display: "inline-flex" }}>{opt.icon}</span>}
                                    {opt.label}
                                </button>
                            );
                        })}
                    </div>
                );
            }

            const Icons = {
                split: (c = "currentColor") => (
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                        <path d="M3 3v3.5a3 3 0 003 3h4a3 3 0 013 3V13" stroke={c} strokeWidth="1.6" strokeLinecap="round" />
                        <path d="M11 11l2 2-2 2M5 1L3 3l2 2" stroke={c} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" />
                    </svg>
                ),
                me: (c = "currentColor") => (
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                        <circle cx="8" cy="5.5" r="2.5" stroke={c} strokeWidth="1.6" />
                        <path d="M2.5 14c.7-2.7 3-4.5 5.5-4.5s4.8 1.8 5.5 4.5" stroke={c} strokeWidth="1.6" strokeLinecap="round" />
                    </svg>
                ),
                arrow: (c = "currentColor") => (
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                        <path d="M3 8h10M9 4l4 4-4 4" stroke={c} strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" />
                    </svg>
                ),
                trash: (c = "currentColor") => (
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                        <path d="M3 4h10M6.5 4V2.5h3V4M5 4l.5 9a1 1 0 001 1h3a1 1 0 001-1L11 4" stroke={c} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" />
                    </svg>
                ),
                plus: (c = "currentColor") => (
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M8 3v10M3 8h10" stroke={c} strokeWidth="2" strokeLinecap="round" />
                    </svg>
                ),
                check: (c = "currentColor") => (
                    <svg width="12" height="12" viewBox="0 0 16 16" fill="none">
                        <path d="M3 8.5l3.5 3.5L13 4.5" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
                    </svg>
                ),
            };

            function SettlementCard({ totals }) {
                const { settlement, sharedTotal } = totals;
                const settled = !settlement;
                const fromColor = settlement ? PEOPLE[settlement.from].color : TOK.ink;
                const toColor = settlement ? PEOPLE[settlement.to].color : TOK.ink;
                return (
                    <div style={{ borderRadius: 22, padding: "22px 20px 20px", background: settled ? TOK.surface : `linear-gradient(155deg, ${TOK.surface} 0%, ${TOK.shareTint} 100%)`, border: `1px solid ${TOK.line}`, position: "relative", overflow: "hidden" }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 8, fontFamily: TOK.sans, fontSize: 11, fontWeight: 600, color: TOK.ink3, textTransform: "uppercase", letterSpacing: 1.2, marginBottom: 14 }}>
                            <span style={{ width: 6, height: 6, borderRadius: 3, background: settled ? TOK.py : TOK.share }} />
                            {settled ? "All settled" : "Settle up"}
                        </div>
                        {settled ? (
                            <div>
                                <div style={{ fontFamily: TOK.sans, fontSize: 22, fontWeight: 700, color: TOK.ink, letterSpacing: -0.5, lineHeight: 1.2 }}>Py and Lukas are even.</div>
                                <div style={{ marginTop: 6, fontFamily: TOK.sans, fontSize: 14, color: TOK.ink3, lineHeight: 1.4 }}>
                                    {sharedTotal > 0 ? `${fmt(sharedTotal)} kr shared so far this period.` : "No shared expenses yet."}
                                </div>
                            </div>
                        ) : (
                            <div>
                                <div style={{ display: "flex", alignItems: "baseline", gap: 10, flexWrap: "wrap" }}>
                                    <span style={{ fontFamily: TOK.mono, fontSize: 38, fontWeight: 600, color: TOK.ink, letterSpacing: -1, lineHeight: 1 }}>{fmt(settlement.amount)}</span>
                                    <span style={{ fontFamily: TOK.sans, fontSize: 15, fontWeight: 500, color: TOK.ink3, letterSpacing: -0.2 }}>kr</span>
                                </div>
                                <div style={{ marginTop: 14, display: "flex", alignItems: "center", gap: 8, fontFamily: TOK.sans, fontSize: 14, color: TOK.ink2, flexWrap: "wrap" }}>
                                    <span style={{ display: "inline-flex", alignItems: "center", gap: 6, padding: "5px 10px 5px 6px", borderRadius: 999, background: PEOPLE[settlement.from].tint, color: fromColor, fontWeight: 600 }}>
                                        <PersonDot who={settlement.from} size={18} />{settlement.from}
                                    </span>
                                    <span style={{ color: TOK.ink4, display: "inline-flex" }}>{Icons.arrow(TOK.ink4)}</span>
                                    <span style={{ display: "inline-flex", alignItems: "center", gap: 6, padding: "5px 10px 5px 6px", borderRadius: 999, background: PEOPLE[settlement.to].tint, color: toColor, fontWeight: 600 }}>
                                        <PersonDot who={settlement.to} size={18} />{settlement.to}
                                    </span>
                                    <span style={{ color: TOK.ink3 }}>via Hyra account</span>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            function AccountCard({ who, totals }) {
                const p = PEOPLE[who];
                const split = who === "Py" ? totals.pySplit : totals.lukasSplit;
                const personal = who === "Py" ? totals.pyPersonal : totals.lukasPersonal;
                const net = who === "Py" ? totals.pyNet : totals.lukasNet;
                const owesHyra = who === "Py" ? totals.pyOwesHyra : totals.lukasOwesHyra;
                const share = totals.eachShare;

                let status = "even";
                if (totals.sharedTotal === 0) status = "empty";
                else if (Math.abs(net) <= 0.5) status = "even";
                else if (net < 0) status = "owes";
                else status = "owed";

                const actionColor = status === "owes" ? TOK.danger : status === "owed" ? TOK.py : TOK.ink3;
                const actionBg = status === "owes" ? "#FBECEC" : status === "owed" ? TOK.pyTint : TOK.surface2;
                const actionLabel = { owes: "Put into Hyra account", owed: "Owed back from Hyra", even: "Hyra account", empty: "Hyra account" }[status];
                const actionValue = { owes: fmt(owesHyra), owed: fmt(Math.abs(net)), even: "Settled", empty: "—" }[status];
                const actionSub = {
                    owes: `your share is ${fmt(share)} kr · you've paid ${fmt(split)}`,
                    owed: `your share is ${fmt(share)} kr · you've paid ${fmt(split)}`,
                    even: `you and ${who === "Py" ? "Lukas" : "Py"} are even`,
                    empty: "no shared expenses yet",
                }[status];

                return (
                    <div style={{ background: TOK.surface, borderRadius: 18, border: `1px solid ${TOK.line}`, overflow: "hidden" }}>
                        <div style={{ padding: "12px 16px", display: "flex", alignItems: "center", gap: 12, borderBottom: `1px solid ${TOK.line2}`, background: `linear-gradient(90deg, ${p.tint} 0%, transparent 70%)` }}>
                            <PersonDot who={who} size={30} />
                            <div style={{ fontFamily: TOK.sans, fontSize: 16, fontWeight: 700, color: TOK.ink, letterSpacing: -0.3, flex: 1 }}>{p.name}</div>
                            <div style={{ fontFamily: TOK.sans, fontSize: 11, fontWeight: 600, color: p.color, textTransform: "uppercase", letterSpacing: 1 }}>Account</div>
                        </div>
                        <div style={{ padding: "14px 16px", display: "flex", alignItems: "center", gap: 12 }}>
                            <span style={{ width: 36, height: 36, borderRadius: 10, background: actionBg, color: actionColor, display: "inline-flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                                {status === "owes" ? Icons.arrow(actionColor) : status === "owed" ? <span style={{ transform: "rotate(180deg)", display: "inline-flex" }}>{Icons.arrow(actionColor)}</span> : Icons.check(actionColor)}
                            </span>
                            <div style={{ flex: 1, minWidth: 0 }}>
                                <div style={{ fontFamily: TOK.sans, fontSize: 12, fontWeight: 600, color: TOK.ink3, textTransform: "uppercase", letterSpacing: 1 }}>{actionLabel}</div>
                                <div style={{ marginTop: 2, fontFamily: TOK.sans, fontSize: 12.5, color: TOK.ink3, lineHeight: 1.35 }}>{actionSub}</div>
                            </div>
                            <div style={{ textAlign: "right" }}>
                                {status === "even" || status === "empty" ? (
                                    <div style={{ fontFamily: TOK.sans, fontSize: 14, fontWeight: 700, color: actionColor, letterSpacing: -0.2 }}>{actionValue}</div>
                                ) : (
                                    <div>
                                        <div style={{ fontFamily: TOK.mono, fontSize: 22, fontWeight: 600, color: actionColor, letterSpacing: -0.6, lineHeight: 1 }}>{actionValue}</div>
                                        <div style={{ fontFamily: TOK.sans, fontSize: 11, fontWeight: 600, color: actionColor, opacity: 0.7, marginTop: 2 }}>kr</div>
                                    </div>
                                )}
                            </div>
                        </div>
                        <div style={{ padding: "12px 16px", display: "flex", alignItems: "center", gap: 12, borderTop: `1px solid ${TOK.line2}`, background: TOK.surface2 }}>
                            <span style={{ width: 28, height: 28, borderRadius: 8, background: "#fff", border: `1px solid ${TOK.line}`, color: TOK.ink3, display: "inline-flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                                {Icons.me(TOK.ink3)}
                            </span>
                            <div style={{ flex: 1, minWidth: 0 }}>
                                <div style={{ fontFamily: TOK.sans, fontSize: 13, fontWeight: 600, color: TOK.ink2, letterSpacing: -0.1 }}>{p.name}'s personal</div>
                                <div style={{ fontFamily: TOK.sans, fontSize: 11.5, color: TOK.ink3, marginTop: 1 }}>just for you · not split</div>
                            </div>
                            <div style={{ textAlign: "right" }}>
                                <div style={{ fontFamily: TOK.mono, fontSize: 15, fontWeight: 600, color: TOK.ink, letterSpacing: -0.3 }}>
                                    {fmt(personal)}{" "}<span style={{ color: TOK.ink3, fontSize: 11, fontWeight: 500 }}>kr</span>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            function ExpenseRow({ exp, onDelete }) {
                const isSplit = exp.type === "split";
                return (
                    <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 14px", background: TOK.surface, borderRadius: 14, border: `1px solid ${TOK.line}` }}>
                        <PersonDot who={exp.person} size={28} />
                        <div style={{ flex: 1, minWidth: 0 }}>
                            <div style={{ fontFamily: TOK.sans, fontSize: 14, fontWeight: 600, color: TOK.ink, letterSpacing: -0.2, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                                {exp.name || "—"}
                            </div>
                            <div style={{ marginTop: 2, display: "flex", alignItems: "center", gap: 6, fontFamily: TOK.sans, fontSize: 11.5, color: TOK.ink3 }}>
                                <span style={{ display: "inline-flex", alignItems: "center", gap: 4, padding: "2px 7px", borderRadius: 999, background: isSplit ? TOK.shareTint : TOK.surface2, color: isSplit ? TOK.share : TOK.ink3, fontWeight: 600, fontSize: 10.5, letterSpacing: 0.2, textTransform: "uppercase", border: `1px solid ${isSplit ? "transparent" : TOK.line}` }}>
                                    {isSplit ? "Split" : "Personal"}
                                </span>
                                <span>·</span>
                                <span>{exp.when}</span>
                            </div>
                        </div>
                        <div style={{ textAlign: "right" }}>
                            <div style={{ fontFamily: TOK.mono, fontSize: 15, fontWeight: 600, color: TOK.ink, letterSpacing: -0.3 }}>
                                {fmt(exp.amount)}{" "}<span style={{ color: TOK.ink3, fontSize: 11, fontWeight: 500 }}>kr</span>
                            </div>
                        </div>
                        <button onClick={() => onDelete(exp.id)} aria-label="Delete" style={{ all: "unset", cursor: "pointer", padding: 6, borderRadius: 8, color: TOK.ink4, display: "inline-flex" }} onMouseEnter={(e) => (e.currentTarget.style.color = TOK.danger)} onMouseLeave={(e) => (e.currentTarget.style.color = TOK.ink4)}>
                            {Icons.trash()}
                        </button>
                    </div>
                );
            }

            function AddForm({ onAdd }) {
                const [person, setPerson] = useState("Py");
                const [type, setType] = useState("split");
                const [name, setName] = useState("");
                const [amount, setAmount] = useState("");
                const amountRef = useRef(null);

                const submit = () => {
                    const a = parseFloat(amount);
                    if (!Number.isFinite(a) || a <= 0) return;
                    const now = new Date();
                    const when = now.toLocaleDateString("sv-SE", { month: "short", day: "numeric" });
                    onAdd({ id: Math.random().toString(36).slice(2, 10), person, type, name: name.trim() || (type === "split" ? "Shared expense" : "Personal"), amount: a, when, t: Date.now() });
                    setName("");
                    setAmount("");
                    amountRef.current?.focus();
                };

                const onKey = (e) => { if (e.key === "Enter") submit(); };
                const canAdd = parseFloat(amount) > 0;
                const fieldLabel = { fontFamily: TOK.sans, fontSize: 11, fontWeight: 600, color: TOK.ink3, textTransform: "uppercase", letterSpacing: 1.1, marginBottom: 8, display: "block" };
                const inputStyle = { width: "100%", boxSizing: "border-box", padding: "13px 14px", background: TOK.surface2, border: `1px solid ${TOK.line}`, borderRadius: 12, outline: "none", fontFamily: TOK.sans, fontSize: 15, color: TOK.ink, letterSpacing: -0.2 };

                return (
                    <div style={{ padding: "20px 18px 18px", background: TOK.surface, borderRadius: 22, border: `1px solid ${TOK.line}` }}>
                        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
                            <div style={{ fontFamily: TOK.sans, fontSize: 17, fontWeight: 700, color: TOK.ink, letterSpacing: -0.4 }}>Add expense</div>
                            <div style={{ fontFamily: TOK.sans, fontSize: 11, color: TOK.ink3 }}>{type === "split" ? "Both pay half" : "Only on this account"}</div>
                        </div>
                        <div style={{ marginBottom: 14 }}>
                            <label style={fieldLabel}>Paid by</label>
                            <Segmented value={person} onChange={setPerson} accent={PEOPLE[person].color} options={[{ value: "Py", label: "Py" }, { value: "Lukas", label: "Lukas" }]} />
                        </div>
                        <div style={{ marginBottom: 14 }}>
                            <label style={fieldLabel}>Type</label>
                            <Segmented value={type} onChange={setType} accent={type === "split" ? TOK.share : TOK.ink} options={[{ value: "split", label: "Split (Hyra)", icon: Icons.split(type === "split" ? "#fff" : TOK.ink3) }, { value: "personal", label: "Just me", icon: Icons.me(type === "personal" ? "#fff" : TOK.ink3) }]} />
                        </div>
                        <div style={{ marginBottom: 12 }}>
                            <label style={fieldLabel}>What for</label>
                            <input style={inputStyle} placeholder="e.g. hyra, groceries, netflix" value={name} onChange={(e) => setName(e.target.value)} onKeyDown={onKey} />
                        </div>
                        <div style={{ marginBottom: 16 }}>
                            <label style={fieldLabel}>Amount (kr)</label>
                            <div style={{ position: "relative" }}>
                                <input ref={amountRef} style={{ ...inputStyle, fontFamily: TOK.mono, fontSize: 22, fontWeight: 600, letterSpacing: -0.5, paddingRight: 50 }} placeholder="0" inputMode="decimal" value={amount} onChange={(e) => setAmount(e.target.value.replace(/[^0-9.,]/g, "").replace(",", "."))} onKeyDown={onKey} />
                                <span style={{ position: "absolute", right: 14, top: "50%", transform: "translateY(-50%)", fontFamily: TOK.sans, fontSize: 13, fontWeight: 600, color: TOK.ink3 }}>kr</span>
                            </div>
                        </div>
                        <button onClick={submit} disabled={!canAdd} style={{ all: "unset", cursor: canAdd ? "pointer" : "not-allowed", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, width: "100%", boxSizing: "border-box", padding: "15px", background: canAdd ? TOK.ink : TOK.ink4, color: "#fff", borderRadius: 14, fontFamily: TOK.sans, fontSize: 15, fontWeight: 600, letterSpacing: -0.2, transition: "background 0.15s ease" }}>
                            {Icons.plus("#fff")}
                            Add to {type === "split" ? "Hyra account" : `${person}'s account`}
                        </button>
                    </div>
                );
            }

            function SplitExpensesApp() {
                const [expenses, setExpenses] = useState(loadExpenses);
                const [savedFlash, setSavedFlash] = useState(false);
                const [filter, setFilter] = useState("all");

                useEffect(() => {
                    saveExpenses(expenses);
                    setSavedFlash(true);
                    const t = setTimeout(() => setSavedFlash(false), 900);
                    return () => clearTimeout(t);
                }, [expenses]);

                const totals = useMemo(() => computeTotals(expenses), [expenses]);
                const visibleExpenses = useMemo(() => {
                    const sorted = [...expenses].sort((a, b) => b.t - a.t);
                    if (filter === "all") return sorted;
                    return sorted.filter((e) => e.type === filter);
                }, [expenses, filter]);

                const onAdd = (exp) => setExpenses((list) => [...list, exp]);
                const onDelete = (id) => setExpenses((list) => list.filter((e) => e.id !== id));
                const onReset = () => {
                    if (expenses.length === 0) return;
                    if (confirm("Clear all expenses?")) setExpenses([]);
                };

                return (
                    <div style={{ minHeight: "100%", background: TOK.bg, fontFamily: TOK.sans, color: TOK.ink, paddingBottom: "calc(env(safe-area-inset-bottom, 0px) + 30px)" }}>
                        <div style={{ position: "sticky", top: 0, zIndex: 5, padding: "calc(env(safe-area-inset-top, 0px) + 20px) 18px 14px", background: `linear-gradient(180deg, ${TOK.bg} 70%, rgba(246,243,238,0))` }}>
                            <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 12 }}>
                                <div>
                                    <div style={{ fontFamily: TOK.sans, fontSize: 11, fontWeight: 600, color: TOK.ink3, letterSpacing: 1.3, textTransform: "uppercase" }}>Hyra account</div>
                                    <h1 style={{ margin: "2px 0 0", fontFamily: TOK.sans, fontSize: 28, fontWeight: 800, color: TOK.ink, letterSpacing: -0.9, lineHeight: 1.1 }}>Split Expenses</h1>
                                    <div style={{ marginTop: 6, display: "flex", alignItems: "center", gap: 8, fontFamily: TOK.sans, fontSize: 13, color: TOK.ink3 }}>
                                        <span style={{ display: "inline-flex", alignItems: "center", gap: 5 }}><span style={{ width: 7, height: 7, borderRadius: 4, background: TOK.py }} /> Py</span>
                                        <span style={{ color: TOK.ink4 }}>·</span>
                                        <span style={{ display: "inline-flex", alignItems: "center", gap: 5 }}><span style={{ width: 7, height: 7, borderRadius: 4, background: TOK.lukas }} /> Lukas</span>
                                    </div>
                                </div>
                                <div style={{ display: "inline-flex", alignItems: "center", gap: 6, padding: "5px 10px", borderRadius: 999, background: savedFlash ? TOK.pyTint : TOK.surface, border: `1px solid ${TOK.line}`, fontFamily: TOK.sans, fontSize: 11, fontWeight: 600, color: savedFlash ? TOK.py : TOK.ink3, transition: "all 0.2s ease" }}>
                                    <span style={{ display: "inline-flex" }}>{Icons.check(savedFlash ? TOK.py : TOK.ink4)}</span>
                                    Saved
                                </div>
                            </div>
                        </div>

                        <div style={{ padding: "0 18px", display: "flex", flexDirection: "column", gap: 14 }}>
                            <SettlementCard totals={totals} />
                            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                                <AccountCard who="Py" totals={totals} />
                                <AccountCard who="Lukas" totals={totals} />
                            </div>
                            <AddForm onAdd={onAdd} />
                            <div>
                                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", margin: "8px 4px 10px" }}>
                                    <div style={{ fontFamily: TOK.sans, fontSize: 11, fontWeight: 600, color: TOK.ink3, textTransform: "uppercase", letterSpacing: 1.2 }}>Activity · {expenses.length}</div>
                                    {expenses.length > 0 && (
                                        <button onClick={onReset} style={{ all: "unset", cursor: "pointer", fontFamily: TOK.sans, fontSize: 12, fontWeight: 600, color: TOK.ink3, padding: "2px 4px" }}>Reset all</button>
                                    )}
                                </div>
                                {expenses.length > 0 && (
                                    <div style={{ marginBottom: 10 }}>
                                        <Segmented value={filter} onChange={setFilter} options={[{ value: "all", label: `All (${expenses.length})` }, { value: "split", label: `Split (${expenses.filter((e) => e.type === "split").length})` }, { value: "personal", label: `Personal (${expenses.filter((e) => e.type === "personal").length})` }]} />
                                    </div>
                                )}
                                {visibleExpenses.length === 0 ? (
                                    <div style={{ padding: "30px 16px", textAlign: "center", borderRadius: 18, border: `1.5px dashed ${TOK.line}`, background: "transparent" }}>
                                        <div style={{ fontFamily: TOK.sans, fontSize: 14, fontWeight: 600, color: TOK.ink2 }}>No expenses yet</div>
                                        <div style={{ marginTop: 4, fontFamily: TOK.sans, fontSize: 12.5, color: TOK.ink3, lineHeight: 1.4, maxWidth: 240, margin: "4px auto 0" }}>
                                            Add a shared expense to start splitting, or log a personal one to just track it.
                                        </div>
                                    </div>
                                ) : (
                                    <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                                        {visibleExpenses.map((exp) => <ExpenseRow key={exp.id} exp={exp} onDelete={onDelete} />)}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            ReactDOM.createRoot(document.getElementById("root")).render(<SplitExpensesApp />);
        </script>
    </body>
</html>
